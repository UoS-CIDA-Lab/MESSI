<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 156 156" width="156" height="156" role="img" aria-label="MESSI icon">
  <!-- emblem: the number-10 jersey (back view), sky-blue and white stripes, ball tucked at the hem -->
  <g transform="translate(4,4)">
    <!-- jersey body -->
    <path d="M36 22 q10 -6 22 -8 q6 8 16 8 q10 0 16 -8 q12 2 22 8 l18 28 l-22 14 l-6 -8 v66 q-28 8 -56 0 v-66 l-6 8 l-22 -14z"
          fill="#ffffff" stroke="#0b1220" stroke-width="2.4" stroke-linejoin="round"/>
    <!-- stripes clipped by drawing them as tall rects then covering with sleeves; keep inside the torso -->
    <g fill="#7dd3fc">
      <rect x="53" y="24" width="10" height="94"/>
      <rect x="69" y="24" width="10" height="94"/>
      <rect x="85" y="24" width="10" height="94"/>
    </g>
    <!-- sleeves painted over the stripe ends -->
    <path d="M36 22 l-18 28 l22 14 l6 -8 v-22 q-4 -8 -10 -12z" fill="#ffffff" stroke="#0b1220" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M112 22 l18 28 l-22 14 l-6 -8 v-22 q4 -8 10 -12z" fill="#ffffff" stroke="#0b1220" stroke-width="2.4" stroke-linejoin="round"/>
    <!-- collar -->
    <path d="M58 14 q16 12 32 0" fill="none" stroke="#0b1220" stroke-width="2.4"/>
    <!-- hem curve -->
    <path d="M46 120 q28 8 56 0" fill="none" stroke="#0b1220" stroke-width="2.4"/>
    <!-- number -->
    <rect x="55" y="54" width="38" height="36" rx="5" fill="#ffffff"/>
    <text x="74" y="84" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="800" fill="#0b1220">10</text>
    <!-- ball at the hem, left side -->
    <circle cx="44" cy="128" r="12" fill="#ffffff" stroke="#0b1220" stroke-width="2"/>
    <path d="M39.5 124.5 l4.5 -3.2 l4.5 3.2 l-1.7 5.2 h-5.6 z" fill="#0b1220"/>
    <path d="M44 121.3 v-4.5 M48.5 124.5 l4.2 -1.5 M46.8 129.7 l2.6 3.7 M41.2 129.7 l-2.6 3.7 M39.5 124.5 l-4.2 -1.5" stroke="#0b1220" stroke-width="1.4" fill="none"/>
  </g>
</svg>
