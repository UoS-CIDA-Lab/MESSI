[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "messi-env"
dynamic = ["version"]
description = "MESSI: A Multi-Agent Environment for Soccer Simulation and Intelligence — JAX-native full-match 11v11 football for imitation and multi-agent RL"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Hyunwoo Park" }]
keywords = ["football", "soccer", "multi-agent", "reinforcement-learning", "imitation-learning", "jax", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "jax>=0.4.38",
    "jaxmarl>=0.0.7",
    "jaxtyping>=0.2.36",
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/UoS-CIDA-Lab/MESSI"
Repository = "https://github.com/UoS-CIDA-Lab/MESSI"
Changelog = "https://github.com/UoS-CIDA-Lab/MESSI/blob/main/CHANGELOG.md"

[project.scripts]
soccerworld-demo = "soccerworld.demo.__main__:main"

[project.optional-dependencies]
render = ["imageio[ffmpeg]>=2.34", "matplotlib>=3.8", "pillow>=10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "soccerworld._version.__version__" }

[tool.setuptools.package-data]
"soccerworld._engine.rule_policy" = ["*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"src/soccerworld/_engine/state.py" = ["F722", "F821"]
