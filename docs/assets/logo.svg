<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 170" width="780" height="170" role="img" aria-label="MESSI — a multi-agent Match Environment for Soccer Simulation and Intelligence">
  <defs>
    <linearGradient id="messi-wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <style>
      .messi-subtitle { fill: #475569; }
      .messi-meta { fill: #64748b; }
      @media (prefers-color-scheme: dark) {
        .messi-subtitle { fill: #e2e8f0; }
        .messi-meta { fill: #94a3b8; }
      }
    </style>
  </defs>
  <g text-anchor="middle">
    <text x="390" y="72" font-family="'Segoe Script', 'Brush Script MT', 'Apple Chancery', 'URW Chancery L', cursive" font-size="72" font-style="italic" font-weight="700" letter-spacing="0" fill="url(#messi-wordmark)">MESSI</text>
    <text class="messi-subtitle" x="390" y="113" font-family="'Segoe Script', 'Brush Script MT', 'Apple Chancery', 'URW Chancery L', cursive" font-size="19" font-style="italic" font-weight="500" letter-spacing="0" textLength="650" lengthAdjust="spacingAndGlyphs">a multi-agent Match Environment for Soccer Simulation and Intelligence</text>
    <text class="messi-meta" x="390" y="141" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14">JAX-native · 11 v 11 · 90-minute regulation · reproducible match analysis</text>
  </g>
</svg>
