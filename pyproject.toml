[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "soccerworld"
dynamic = ["version"]
description = "A JAX-native full-match football world engine for learning and simulation"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Hyunwoo Park" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "jax>=0.4.38",
    "jaxmarl>=0.0.7",
    "jaxtyping>=0.2.36",
    "numpy>=1.26",
]

[project.scripts]
soccerworld-demo = "soccerworld.demo.__main__:main"

[project.optional-dependencies]
render = ["imageio[ffmpeg]>=2.34", "matplotlib>=3.8", "pillow>=10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "soccerworld._version.__version__" }

[tool.setuptools.package-data]
"soccerworld._engine.rule_policy" = ["*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"src/soccerworld/_engine/state.py" = ["F722", "F821"]
