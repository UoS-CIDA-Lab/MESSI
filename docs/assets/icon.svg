<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144" width="144" height="144" role="img" aria-label="MESSI icon">
  <defs><linearGradient id="g-pitch" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#15803d"/><stop offset="100%" stop-color="#064e3b"/></linearGradient></defs>
  <g>
    <rect x="0" y="0" width="144" height="144" rx="26" fill="#0f6b3a" style="fill:url(#g-pitch)"/>
    <g fill="none" stroke="#ecfdf5" stroke-width="2.5" opacity="0.6"><rect x="14" y="14" width="116" height="116" rx="6"/><line x1="72" y1="14" x2="72" y2="130"/><circle cx="72" cy="72" r="18"/><rect x="14" y="46" width="20" height="52"/><rect x="110" y="46" width="20" height="52"/></g>
